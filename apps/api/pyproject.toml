[project]
name = "swaram-api"
version = "0.2.0"
description = "Mock-first multilingual campaign calling API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "cryptography>=44,<46",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
