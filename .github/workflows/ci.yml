name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system "./apps/api[dev]"
      - run: ruff check apps/api
      - run: mypy app
        working-directory: apps/api
      - run: pytest tests -q
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
